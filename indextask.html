        class Product{
            #stock
            constructor(name,price,stock){
               this.name = name;
               this.price = price;
               this.#stock = stock; 
            }

            getter(){
                return `${this.#stock}`;
            }
        sell(quantity){
            this.quantity = quantity;
            if(this.#stock > this.quantity){
               this.#stock = this.#stock - this.quantity;
              return `Sold: ${this.quantity} ${this.name}`;
            } else{
                return 'not enough stock';
            }
        }
        restock(quantity){
            this.#stock = this.#stock + this.quantity;
            return `${this.#stock}`;
        }
        }

            constructor(name, price, stock, warranty){
                super();

            } else{

            }

            }
        }
