        let listfruits = ['banana','mango'];
        const store = localStorage.getItem('fruits');
        if(store != null){
            listfruits= JSON.parse(store);

        }
        const listfruitsparents = document.getElementById('lifruit'); 
        for (let i = 0; i < listfruits.length; i++){
             const fruitelement = document.createElement('li');
             fruitelement.textContent = listfruits[i];
             listfruitsparents.appendChild(fruitelement);
             

        }
        const fruitinput = document.getElementById('fruitadd');
        const addbtn = document.getElementById('addbtn');
        addbtn.onclick = function (){
            const valueinput = fruitinput.value;
            listfruits.push(valueinput);

            listfruitsparents.innerHTML = " ";

            for (let i = 0; i < listfruits.length; i++){
            const fruitelement = document.createElement('li');
             fruitelement.textContent = listfruits[i];
             listfruitsparents.appendChild(fruitelement);
            }
           
            fruitinput.value = "";
            localStorage.setItem("fruits",JSON.stringify(listfruits));
        };

        fruitinput.onkeydown = function(){
            if(event.key == "Enter"){
                const valueinput = fruitinput.value;
                listfruits.push(valueinput);

                listfruitsparents.innerHTML = "";

            for (let i = 0; i <listfruits.length;i++){
               const fruitelement = document.createElement('li');
             fruitelement.textContent = listfruits[i];
             listfruitsparents.appendChild(fruitelement);   
            }

            fruitinput.value = "";

            localStorage.setItem("friuts",JSON.stringify(listfruits));

            
            }
        }
